version: 1
name: AlphaPortal
slug: alphaportal
env:
  - name: ALPHAPORTAL_REFRESH_TOKEN
    secret: true
    required: true
    help: >-
      The refresh token from a signed-in AlphaPortal browser tab. In the tab's
      DevTools console run: JSON.parse(localStorage.user).User.RefreshToken —
      it is an 8-day, reusable JWT, so re-capture and update this secret if it
      expires. (Locally, if unset, the server can also read it from a signed-in
      tab via the fetchproxy/Transporter bridge; a plain hosted registration has
      no bridge, so set this secret.)
  - name: ALPHAPORTAL_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to 1 to skip the browser-bridge fallback entirely and require
      ALPHAPORTAL_REFRESH_TOKEN. Unset, the fallback is attempted.
egress:
  allow:
    # The AlphaRoute REST API — the ONLY host the server contacts. Every read,
    # every write, and the token-refresh exchange
    # (POST /AlphaCore/v1/public/refresh-token) go here. Without this on the
    # isolated tier, fetch is blocked and tools report "could not reach the API".
    - api.alpharoute.app
state:
  dataDir: true
  reason: >-
    Persists the rotating refresh token under $HOME so each refresh rolls the
    8-day window forward on a warm machine. Without it the child always falls
    back to the registration-time ALPHAPORTAL_REFRESH_TOKEN secret, which still
    works for 8 days from capture but cannot roll forward across cold starts.
